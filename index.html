    <!-- Home hero (the largest image on the landing page): start the download now instead of after
         the app's JavaScript has run. Only when Home is the page being opened, and never on the admin
         host. Same files and breakpoints as <ResponsiveImage name="hero-home" mobileName="hero-home-mobile">;
         `type` makes browsers without AVIF skip the hint and pick the right file later. -->
    <script>
      (function () {
        if (location.hostname === 'private.transglobalfreightlogistics.ltd') return;
        var page = (location.hash.replace('#', '').replace(/^\//, '').split('/')[0]) || 'home';
        if (page !== 'home') return;
        var set = function (name, widths) {
          return widths.map(function (w) { return '/images/site/' + name + '-' + w + '.avif ' + w + 'w'; }).join(', ');
        };
        [
          ['(max-width: 767px)', set('hero-home-mobile', [640, 1024, 1290])],
          ['(min-width: 768px)', set('hero-home', [640, 1024, 1600, 2400])]
        ].forEach(function (h) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.type = 'image/avif';
          l.media = h[0];
          l.setAttribute('imagesrcset', h[1]);
          l.setAttribute('imagesizes', '100vw');
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        });
      })();
    </script>
